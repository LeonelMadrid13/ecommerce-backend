$kind: http-request
url: '{{baseUrl}}/auth/login'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email":"{{adminEmail}}","password":"{{adminPassword}}"}'
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      pm.test('envelope contains success/data/timestamp', function () {
        pm.expect(body.success).to.eql(true);
        pm.expect(body).to.have.property('data');
        pm.expect(body).to.have.property('timestamp');
      });
      pm.test('token contract is valid', function () {
        pm.expect(body.data.access_token).to.be.a('string').and.not.empty;
        pm.expect(body.data.refresh_token).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('adminAccessToken', body.data.access_token);
    language: text/javascript
order: 1000

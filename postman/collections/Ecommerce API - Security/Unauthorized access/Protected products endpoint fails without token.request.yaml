$kind: http-request
url: '{{baseUrl}}/products'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"name":"No token product","description":"security","price":10,"stock":1}'
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('status is 401', function () { pm.response.to.have.status(401); });
      pm.test('error envelope is present', function () { pm.expect(body.success).to.eql(false); });
    language: text/javascript
order: 3000

$kind: http-request
url: '{{baseUrl}}/auth/refresh'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"refresh_token":"{{userRefreshToken}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.collectionVariables.set('userAccessToken', body.data.access_token);
    language: text/javascript
order: 3000

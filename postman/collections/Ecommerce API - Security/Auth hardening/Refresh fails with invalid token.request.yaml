$kind: http-request
url: '{{baseUrl}}/auth/refresh'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"refresh_token":"definitely-invalid-token"}'
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('status is 401', function () { pm.response.to.have.status(401); });
      pm.test('error envelope is present', function () {
        pm.expect(body.success).to.eql(false);
        pm.expect(body).to.have.property('message');
      });
    language: text/javascript
order: 2000

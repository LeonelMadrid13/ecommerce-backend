$kind: http-request
url: '{{baseUrl}}/orders'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{userAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      pm.test('response is an array', function () { pm.expect(pm.response.json().data).to.be.an('array'); });
    language: text/javascript
order: 3000

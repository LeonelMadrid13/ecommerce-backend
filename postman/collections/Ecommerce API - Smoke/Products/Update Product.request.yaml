$kind: http-request
url: '{{baseUrl}}/products/{{productId}}'
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"name":"Postman Smoke Laptop Pro","description":"Updated by smoke suite","price":1599.99,"stock":10}'
auth:
  type: bearer
  credentials:
    token: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: pm.test('status is 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000

$kind: http-request
url: '{{baseUrl}}/orders/{{orderId}}'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{userAccessToken}}'
scripts:
  - type: afterResponse
    code: pm.test('status is 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
